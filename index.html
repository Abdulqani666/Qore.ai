<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<title>Qore</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.3/dist/docx-preview.min.js"></script>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1c1c1a;--mute:#6b6a66;--line:#e3e1db;--accent:#1c1c1a;--accent-ink:#fff;--soft:#ecebe6;--bad:#b3261e;--bubble:#ebe9e3}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--panel:#252523;--ink:#ecebe7;--mute:#9b9a94;--line:#3a3a37;--accent:#ecebe7;--accent-ink:#1b1b19;--soft:#2e2e2b;--bad:#f2928b;--bubble:#2e2e2b}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 16px/1 Georgia,serif}
header h1{margin:0;font:600 17px/1 Georgia,"Times New Roman",serif;letter-spacing:.2px;flex:1}
.ghost{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;display:inline-flex;gap:7px;align-items:center;font-size:14px}
.ghost:hover{background:var(--soft)}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#thread{flex:1;overflow-y:auto;padding:8px 16px 20px;scroll-behavior:smooth}
.m{display:flex;gap:10px;margin:16px 0;animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m.u{justify-content:flex-end}
.m.u .bd{background:var(--bubble);border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:85%}
.av{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 13px/1 Georgia,serif;flex:none;margin-top:2px}
.m.a .bd{min-width:0;flex:1}
.bd p{margin:0 0 8px}
.bd p:last-child{margin-bottom:0}
.dots{display:inline-flex;gap:4px;padding:8px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.fc{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;max-width:440px}
.m.u .fc{margin:0;background:var(--panel)}
.badge{width:38px;height:44px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font:700 11px/1 system-ui;color:var(--ink);letter-spacing:.4px;flex:none}
.fc .t{min-width:0;flex:1}
.fc .t b{display:block;font-size:14.5px;overflow-wrap:anywhere;line-height:1.3}
.fc .t span{font-size:12.5px;color:var(--mute)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 15px;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45}
.steps{list-style:none;margin:8px 0 0;padding:0;font-size:14px;color:var(--mute)}
.steps li{padding:4px 0 4px 22px;position:relative}
.steps li::before{content:"";position:absolute;left:4px;top:11px;width:9px;height:5px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg) translateY(-3px)}
.steps b{color:var(--ink);font-weight:600}
.err{color:var(--bad)}
.dock{padding:6px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:13.5px;color:var(--mute)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.comp{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:7px 7px 7px 8px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.comp.on{border-color:var(--ink)}
.plus{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;flex:none}
.comp .ph{flex:1;text-align:left;border:0;background:none;padding:8px 2px;color:var(--mute);font-size:16px}
.send{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.fine{text-align:center;font-size:12px;color:var(--mute);margin:8px 0 0}
/* design sheet */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;max-width:760px;margin:0 auto}
#sheet.on{transform:none}
.sh-h{display:flex;align-items:center;padding:14px 18px 8px}
.sh-h h2{margin:0;font:600 18px/1 Georgia,serif;flex:1}
.sh-b{overflow-y:auto;padding:4px 18px 18px;-webkit-overflow-scrolling:touch}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.sec h3{margin:0 0 10px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
select,input[type=text],input[type=number]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px}
.chk{display:flex;gap:9px;align-items:center;margin:6px 0 10px;font-size:15px;color:var(--ink)}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.note{font-size:13px;color:var(--mute);margin:6px 0 0}
.sh-f{padding:10px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sh-f .btn.pri{flex:1}
#printArea{display:none}
@media print{
 @page{size:A4;margin:0}
 body.printing{background:#fff}
 body.printing .app,body.printing #sheet,body.printing #veil{display:none!important}
 body.printing #printArea{display:block}
 body.printing #printArea section.docx{box-shadow:none!important;margin:0!important;break-after:page}
}
</style>
</head>
<body>
<div class="app">
 <header>
  <div class="logo">Q</div>
  <h1>Qore</h1>
  <button class="ghost" id="open" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Design</button>
 </header>
 <main id="thread" aria-live="polite"></main>
 <div class="dock">
  <div class="chips" id="chips" role="group" aria-label="Design">
   <button class="chip" data-p="exam" aria-pressed="true">School exam</button>
   <button class="chip" data-p="plain" aria-pressed="false">Plain document</button>
   <button class="chip" id="mine" aria-pressed="false">My saved design</button>
  </div>
  <div class="comp" id="comp">
   <button class="plus" id="plus" aria-label="Attach a Word file"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
   <button class="ph" id="ph">Attach a Word file to format</button>
   <button class="send" id="send" aria-label="Choose a file"><svg viewBox="0 0 24 24"><path d="M12 19V6M6 11l6-6 6 6"/></svg></button>
  </div>
  <input type="file" id="pick" accept=".docx" hidden>
  <p class="fine">Your file is processed on this device. It is never uploaded.</p>
 </div>
</div>

<div id="veil"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Design settings" aria-hidden="true">
 <div class="sh-h"><h2>Design</h2><button class="ghost" id="close">Done</button></div>
 <div class="sh-b">
  <div class="sec"><h3>Text</h3>
   <div class="row">
    <div class="f"><label for="font">Font</label><select id="font"><option>Verdana</option><option>Arial</option><option>Times New Roman</option><option>Calibri</option><option>Georgia</option><option>Tahoma</option></select></div>
    <div class="f"><label for="size">Size (pt)</label><input type="number" id="size" min="8" max="24" step="0.5"></div>
   </div>
   <label class="chk"><input type="checkbox" id="force"> Same size on every line, including titles</label>
   <label class="chk"><input type="checkbox" id="bw"> Black and white only (remove colors)</label>
   <label class="chk"><input type="checkbox" id="tight"> Compact spacing</label>
   <div class="f"><label for="caps">Capital letters</label><select id="caps"><option value="none">Leave as written</option><option value="headings">Headings and bold lines</option><option value="all">All text</option></select></div>
   <div class="f"><label for="num">Numbering</label><select id="num"><option value="none">None</option><option value="headings">Number headings and bold lines</option><option value="paras">Number every paragraph outside tables</option></select></div>
  </div>
  <div class="sec"><h3>Parts and tables</h3>
   <label class="chk"><input type="checkbox" id="bands"> Black bars on "Part" headings</label>
   <label class="chk"><input type="checkbox" id="tbl"> Black lines on tables</label>
  </div>
  <div class="sec"><h3>Title block</h3>
   <label class="chk"><input type="checkbox" id="tb"> Add title block at the top</label>
   <div class="f"><label for="t1">Line 1 (school name)</label><input type="text" id="t1"></div>
   <div class="f"><label for="t2">Line 2 (subject or exam)</label><input type="text" id="t2"></div>
   <div class="f"><label for="t3">Line 3 (term or date)</label><input type="text" id="t3"></div>
   <label class="chk"><input type="checkbox" id="lg"> Show logo on the left</label>
   <div style="display:flex;gap:12px;align-items:center"><img id="lgimg" alt="Logo preview" style="width:52px;height:auto"><button class="btn" id="lgbtn">Change logo</button><input type="file" id="lgpick" accept="image/png,image/jpeg" hidden></div>
   <p class="note">Use this only on documents that do not already have a title.</p>
  </div>
  <div class="sec"><h3>Student box</h3>
   <label class="chk"><input type="checkbox" id="ib"> Add box with Class, Marks, Name, Roll No, Date, Teacher</label>
   <div class="row">
    <div class="f"><label for="ic">Class</label><input type="text" id="ic" placeholder="e.g. 6"></div>
    <div class="f"><label for="im">Total marks</label><input type="text" id="im" placeholder="e.g. 10"></div>
   </div>
   <div class="f"><label for="it">Teacher (leave empty for a blank line)</label><input type="text" id="it"></div>
  </div>
  <div class="sec"><h3>Page</h3>
   <div class="row">
    <div class="f"><label for="mt">Top and bottom margin (mm)</label><input type="number" id="mt" min="5" max="50"></div>
    <div class="f"><label for="ml">Left and right margin (mm)</label><input type="number" id="ml" min="5" max="50"></div>
   </div>
   <label class="chk"><input type="checkbox" id="border"> Single-line border around every page</label>
  </div>
  <div class="sec"><h3>Footer</h3>
   <div class="f"><label for="ft">Footer text (left side)</label><input type="text" id="ft" placeholder="Leave empty for no text"></div>
   <div class="row">
    <div class="f"><label for="pn">Page numbers</label><select id="pn"><option value="none">None</option><option value="n">1</option><option value="x">Page 1</option><option value="xofy">Page 1 of 4</option></select></div>
    <div class="f"><label for="pos">Number position</label><select id="pos"><option value="right">Right</option><option value="center">Center</option></select></div>
   </div>
   <label class="chk"><input type="checkbox" id="fline"> Thin line above the footer</label>
   <p class="note">If the footer text is empty and page numbers are off, the existing footer is kept.</p>
  </div>
 </div>
 <div class="sh-f"><button class="btn" id="save">Save as my design</button><button class="btn pri" id="apply">Done</button></div>
</div>
<div id="printArea"></div>

<script>
const W="http://schemas.openxmlformats.org/wordprocessingml/2006/main",R="http://schemas.openxmlformats.org/officeDocument/2006/relationships";
const NS=`xmlns:w="${W}" xmlns:r="${R}" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"`;
const $=id=>document.getElementById(id);
const IDS=["font","size","force","bw","tight","caps","num","bands","tbl","tb","t1","t2","t3","lg","ib","ic","im","it","mt","ml","border","ft","pn","pos","fline"];
const PRE={
exam:{font:"Verdana",size:10,force:false,bw:true,tight:true,caps:"headings",num:"none",bands:true,tbl:true,tb:true,t1:"ABUBAKAR SADIQ PRIMARY SCHOOL",t2:"",t3:"MONTHLY EXAMINATION",lg:true,ib:true,ic:"",im:"",it:"",mt:15,ml:18,border:false,ft:"EXAMINATION BOARD",pn:"x",pos:"right",fline:true},
plain:{font:"Times New Roman",size:12,force:false,bw:false,tight:false,caps:"none",num:"none",bands:false,tbl:false,tb:false,t1:"",t2:"",t3:"",lg:false,ib:false,ic:"",im:"",it:"",mt:25,ml:25,border:false,ft:"",pn:"n",pos:"center",fline:false}};
const get=()=>Object.fromEntries(IDS.map(i=>[i,$(i).type==="checkbox"?$(i).checked:$(i).value]));
const put=o=>IDS.forEach(i=>{if(!(i in o))return;$(i).type==="checkbox"?$(i).checked=!!o[i]:$(i).value=o[i]});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
put(PRE.exam);

/* ---------- chat ---------- */
const th=$("thread");
const down=()=>{th.scrollTop=th.scrollHeight};
function say(html,who){const d=document.createElement("div");d.className="m "+(who==="u"?"u":"a");d.innerHTML=(who==="u"?"":'<div class="av">Q</div>')+'<div class="bd">'+html+"</div>";th.appendChild(d);down();return d.querySelector(".bd")}
const typing=()=>say('<span class="dots" aria-label="Working"><i></i><i></i><i></i></span>');
const size=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
const fcard=(name,sub,ext)=>`<div class="fc"><div class="badge">${ext}</div><div class="t"><b>${esc(name)}</b><span>${esc(sub)}</span></div></div>`;
say("<p>Hello. Attach a finished Word document and I will put it in your design. I never change your words.</p><p>The design is the school exam style: logo and titles, student box, black part bars, ruled tables and a footer. Tap <b>Design</b> to change anything.</p>");

/* ---------- design choice ---------- */
let mineStore=null;
try{mineStore=JSON.parse(localStorage.getItem("fmt-mine")||"null")}catch(e){}
function mark(id){document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String((c.dataset.p||c.id)===id)))}
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{put(PRE[b.dataset.p]);mark(b.dataset.p)});
$("mine").onclick=()=>{if(mineStore){put(mineStore);mark("mine")}else{say("<p>You have no saved design yet. Tap <b>Design</b>, set it up, then choose <b>Save as my design</b>.</p>")}};
$("save").onclick=()=>{mineStore=get();try{localStorage.setItem("fmt-mine",JSON.stringify(mineStore))}catch(e){}mark("mine");close_();say("<p>Saved. Tap <b>My saved design</b> to use it again.</p>")};
document.querySelectorAll("#sheet input,#sheet select").forEach(e=>e.addEventListener("change",()=>mark("")));

/* ---------- sheet ---------- */
let lastFocus=null;
function open_(){lastFocus=document.activeElement;$("veil").classList.add("on");$("sheet").classList.add("on");$("sheet").setAttribute("aria-hidden","false");$("close").focus()}
function close_(){$("veil").classList.remove("on");$("sheet").classList.remove("on");$("sheet").setAttribute("aria-hidden","true");lastFocus&&lastFocus.focus&&lastFocus.focus()}
$("open").onclick=open_;$("close").onclick=close_;$("apply").onclick=close_;$("veil").onclick=close_;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("sheet").classList.contains("on"))close_()});

$("lgpick").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{setLogo(r.result);try{localStorage.setItem("fmt-logo",r.result)}catch(x){}};r.readAsDataURL(f)};

/* ---------- saving and PDF ---------- */
async function saveBytes(name,data,type){
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function toPdf(data){
 const area=$("printArea");area.innerHTML="";
 await docx.renderAsync(new Blob([data]),area,null,{className:"docx",inWrapper:false,breakPages:true,ignoreLastRenderedPageBreak:false});
 try{await document.fonts.ready}catch(e){}
 document.body.classList.add("printing");
 const done=()=>{document.body.classList.remove("printing");area.innerHTML="";window.removeEventListener("afterprint",done)};
 window.addEventListener("afterprint",done);
 setTimeout(()=>window.print(),200)}

/* ---------- files ---------- */
let file=null,buf=null,busy=false;
const pick=$("pick");
const choose=()=>pick.click();
["plus","ph","send"].forEach(i=>$(i).onclick=choose);
pick.onchange=e=>{const f=e.target.files[0];pick.value="";run(f)};
["dragover","dragenter"].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();$("comp").classList.add("on")}));
["dragleave","drop"].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();$("comp").classList.remove("on")}));
document.addEventListener("drop",e=>run(e.dataTransfer.files[0]));
async function run(f){
 if(!f||busy)return;
 if(!/\.docx$/i.test(f.name)){say(`<p class="err">${esc(f.name)} is not a .docx file. Please attach a Word file.</p>`);return}
 file=f;buf=await f.arrayBuffer();
 say(fcard(f.name,size(f.size),"DOCX"),"u");
 await format()}
async function format(){
 if(busy||!buf)return;busy=true;
 const t=typing();
 try{
  await new Promise(r=>setTimeout(r,400));
  const{data,log}=await build(get());
  const name=file.name.replace(/\.docx$/i,"")+"_formatted.docx";
  t.innerHTML=`<p>Done. Your document is in the new design.</p><ul class="steps">${log.map(l=>`<li><b>${esc(l[0])}</b>: ${esc(l[1])}</li>`).join("")}</ul>${fcard(name,size(data.length),"DOCX")}<div class="acts"><button class="btn pri" data-a="docx">Download Word</button><button class="btn" data-a="pdf">Save as PDF</button><button class="btn" data-a="again">Format again</button></div>`;
  t.querySelector('[data-a=docx]').onclick=()=>saveBytes(name,data,"application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  t.querySelector('[data-a=pdf]').onclick=async e=>{const b=e.currentTarget;b.disabled=true;try{await toPdf(data)}catch(x){say(`<p class="err">Could not make the PDF: ${esc(x.message)}. Download the Word file and save it as PDF from Word.</p>`)}b.disabled=false};
  t.querySelector('[data-a=again]').onclick=()=>format();
  down();
 }catch(e){t.innerHTML=`<p class="err">I could not format this file: ${esc(e.message)}</p><div class="acts"><button class="btn" data-a="retry">Try again</button></div>`;t.querySelector("[data-a=retry]").onclick=()=>format()}
 finally{busy=false}
}

/* ---------- formatting engine ---------- */
const qa=(n,t)=>Array.from(n.getElementsByTagNameNS(W,t));
const mk=(d,t,a)=>{const e=d.createElementNS(W,"w:"+t);for(const k in a)e.setAttributeNS(W,"w:"+k,a[k]);return e};
const attr=(e,k)=>e.getAttributeNS(W,k);
const isBold=r=>{const b=qa(r,"b")[0];return b&&attr(b,"val")!=="0"&&attr(b,"val")!=="false"};
function isHeading(p){
 const ps=qa(p,"pStyle")[0];
 if(ps&&/^(heading|title|subtitle)/i.test(attr(ps,"val")))return true;
 const runs=qa(p,"r").filter(r=>qa(r,"t").some(t=>t.textContent.trim()));
 return runs.length>0&&runs.every(isBold)}
const inTable=n=>{for(;n;n=n.parentNode)if(n.localName==="tbl")return true;return false};
const text=p=>qa(p,"t").map(t=>t.textContent).join("");
const KW=/^\s*(part|qaybta|qaybaha|qiimaynta|section)\s+[\w\u00C0-\u024F]+/i;
let useKW=false;
function isBand(p){
 if(inTable(p))return false;
 const t=text(p).trim();if(!t||t.length>60)return false;
 if(useKW)return KW.test(t)&&isHeading(p);
 const ps=qa(p,"pStyle")[0];
 if(KW.test(t))return true;
 return isHeading(p)&&t===t.toUpperCase()&&/[A-Z]/.test(t)&&t.length<=40}
const frag=(d,xml)=>{const r=new DOMParser().parseFromString(`<root ${NS}>${xml}</root>`,"application/xml");if(r.getElementsByTagName("parsererror").length)throw new Error("Internal layout error");return Array.from(r.documentElement.childNodes).map(n=>d.importNode(n,true))};
const rfx=f=>`<w:rFonts w:ascii="${f}" w:hAnsi="${f}" w:eastAsia="${f}" w:cs="${f}"/>`;

function fieldRuns(rp,code){
 const f=t=>`<w:r>${rp}<w:fldChar w:fldCharType="${t}"/></w:r>`;
 return f("begin")+`<w:r>${rp}<w:instrText xml:space="preserve"> ${code} </w:instrText></w:r>`+f("separate")+`<w:r>${rp}<w:t>1</w:t></w:r>`+f("end")}
function footerXml(o,tw){
 const sz=Math.max(16,Math.round((o.size-1)*2)),f=esc(o.font);
 const rp=`<w:rPr>${rfx(f)}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr>`;
 const t=s=>`<w:r>${rp}<w:t xml:space="preserve">${esc(s)}</w:t></w:r>`;
 let num="";
 if(o.pn==="n")num=fieldRuns(rp,"PAGE");
 if(o.pn==="x")num=t("Page ")+fieldRuns(rp,"PAGE");
 if(o.pn==="xofy")num=t("Page ")+fieldRuns(rp,"PAGE")+t(" of ")+fieldRuns(rp,"NUMPAGES");
 const pos=o.pos==="center"?`<w:tab w:val="center" w:pos="${Math.round(tw/2)}"/>`:`<w:tab w:val="right" w:pos="${tw}"/>`;
 const body=(o.ft?t(o.ft):"")+(num?`<w:r>${rp}<w:tab/></w:r>`+num:"");
 const bd=o.fline?`<w:pBdr><w:top w:val="single" w:sz="4" w:space="6" w:color="000000"/></w:pBdr>`:"";
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr xmlns:w="${W}" xmlns:r="${R}"><w:p><w:pPr>${bd}<w:tabs>${pos}</w:tabs><w:spacing w:before="0" w:after="0"/></w:pPr>${body}</w:p></w:ftr>`}

function titleXml(o,tw,use){
 const f=esc(o.font),LW=use?1500:0;
 const none=["top","left","bottom","right","insideH","insideV"].map(e=>`<w:${e} w:val="nil"/>`).join("");
 const line=(t,sz)=>t?`<w:p><w:pPr><w:spacing w:before="0" w:after="40"/><w:jc w:val="center"/></w:pPr><w:r><w:rPr>${rfx(f)}<w:b/><w:bCs/><w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${esc(t)}</w:t></w:r></w:p>`:"";
 let c1="";
 if(use){
  const cx=720000,cy=Math.round(cx*logo.h/logo.w);
  c1=`<w:tc><w:tcPr><w:tcW w:w="${LW}" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr><w:spacing w:before="0" w:after="0"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="9001" name="Logo"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="0" name="logo"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdFmtLogo"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p></w:tc>`}
 const lines=line(o.t1,Math.round((o.size+4)*2))+line(o.t2,Math.round((o.size+2)*2))+line(o.t3,Math.round(Math.max(o.size-1,8)*2));
 const c2=`<w:tc><w:tcPr><w:tcW w:w="${tw-LW}" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${lines||"<w:p/>"}</w:tc>`;
 const grid=use?`<w:gridCol w:w="${LW}"/><w:gridCol w:w="${tw-LW}"/>`:`<w:gridCol w:w="${tw}"/>`;
 const tbl=`<w:tbl><w:tblPr><w:tblW w:w="${tw}" w:type="dxa"/><w:tblBorders>${none}</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${grid}</w:tblGrid><w:tr>${c1}${c2}</w:tr></w:tbl>`;
 const rule=`<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="12" w:space="1" w:color="000000"/></w:pBdr><w:spacing w:before="0" w:after="160" w:line="120" w:lineRule="exact"/></w:pPr></w:p>`;
 return tbl+rule}

function infoXml(o,tw){
 const f=esc(o.font),sz=Math.round(Math.max(o.size-1,8)*2),yr=new Date().getFullYear(),h=Math.round(tw/2);
 const bd=["top","left","bottom","right","insideH","insideV"].map(e=>`<w:${e} w:val="single" w:sz="6" w:space="0" w:color="000000"/>`).join("");
 const rp=b=>`<w:rPr>${rfx(f)}${b?"<w:b/><w:bCs/>":""}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr>`;
 const cell=(label,val)=>`<w:tc><w:tcPr><w:tcW w:w="${h}" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr><w:spacing w:before="70" w:after="70"/></w:pPr><w:r>${rp(1)}<w:t xml:space="preserve">${esc(label)} </w:t></w:r><w:r>${rp(0)}<w:t xml:space="preserve">${esc(val)}</w:t></w:r></w:p></w:tc>`;
 const u=n=>"_".repeat(n);
 const rows=[[["Class:",o.ic||u(8)],["Total Marks:",o.im||u(8)]],[["Student Name:",u(26)],["Roll No:",u(18)]],[["Date:",`____ / ____ / ${yr}`],["Teacher:",o.it||u(24)]]];
 const tbl=`<w:tbl><w:tblPr><w:tblW w:w="${tw}" w:type="dxa"/><w:tblBorders>${bd}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="100" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="${h}"/><w:gridCol w:w="${tw-h}"/></w:tblGrid>${rows.map(r=>`<w:tr>${cell(...r[0])}${cell(...r[1])}</w:tr>`).join("")}</w:tbl>`;
 return tbl+`<w:p><w:pPr><w:spacing w:before="0" w:after="120"/></w:pPr></w:p>`}

async function build(o){
 o.size=parseFloat(o.size)||10;
 const zip=await JSZip.loadAsync(buf),log=[],P=new DOMParser(),S=new XMLSerializer();
 if(!zip.file("word/document.xml"))throw new Error("This file has no document body.");
 const doc=P.parseFromString(await zip.file("word/document.xml").async("string"),"application/xml");
 if(doc.getElementsByTagName("parsererror").length)throw new Error("The document text could not be read.");
 const half=String(Math.round(o.size*2));

 /* styles: font, size, colors, spacing */
 const sf=zip.file("word/styles.xml");
 if(sf){
  const st=P.parseFromString(await sf.async("string"),"application/xml");
  qa(st,"rFonts").forEach(e=>{while(e.attributes.length)e.removeAttributeNode(e.attributes[0]);["ascii","hAnsi","eastAsia","cs"].forEach(k=>e.setAttributeNS(W,"w:"+k,o.font))});
  let dd=qa(st,"docDefaults")[0];
  if(!dd){dd=mk(st,"docDefaults");st.documentElement.insertBefore(dd,st.documentElement.firstChild)}
  let rd=qa(dd,"rPrDefault")[0];if(!rd){rd=mk(st,"rPrDefault");dd.insertBefore(rd,dd.firstChild)}
  let rp=qa(rd,"rPr")[0];if(!rp){rp=mk(st,"rPr");rd.appendChild(rp)}
  qa(rp,"rFonts").concat(qa(rp,"sz"),qa(rp,"szCs")).forEach(e=>e.remove());
  const rf=mk(st,"rFonts");["ascii","hAnsi","eastAsia","cs"].forEach(k=>rf.setAttributeNS(W,"w:"+k,o.font));
  rp.insertBefore(rf,rp.firstChild);rp.appendChild(mk(st,"sz",{val:half}));rp.appendChild(mk(st,"szCs",{val:half}));
  if(o.tight){
   let pd=qa(dd,"pPrDefault")[0];if(!pd){pd=mk(st,"pPrDefault");rd.after(pd)}
   let pp=qa(pd,"pPr")[0];if(!pp){pp=mk(st,"pPr");pd.appendChild(pp)}
   qa(pp,"spacing").forEach(e=>e.remove());pp.appendChild(mk(st,"spacing",{after:"60",line:"252",lineRule:"auto"}));
   qa(st,"style").forEach(s=>{if(attr(s,"styleId")==="Normal")qa(s,"spacing").forEach(e=>e.remove())});
  }
  if(o.bw)qa(st,"color").concat(qa(st,"highlight"),qa(st,"shd")).forEach(e=>e.remove());
  qa(st,"style").forEach(s=>{
   const keep=!o.force&&attr(s,"styleId")!=="Normal"&&!(s.getAttributeNS(W,"default")==="1");
   if(!keep||attr(s,"styleId")==="Normal")qa(s,"sz").concat(qa(s,"szCs")).forEach(e=>e.remove())});
  zip.file("word/styles.xml",S.serializeToString(st));
 }
 /* runs */
 qa(doc,"rFonts").forEach(e=>e.remove());
 if(o.force)qa(doc,"sz").concat(qa(doc,"szCs")).forEach(e=>{if(e.parentNode.localName==="rPr")e.remove()});
 log.push(["Font",`${o.font}, ${o.size} pt${o.force?" on every line":""}`]);
 if(o.bw){qa(doc,"color").concat(qa(doc,"highlight"),qa(doc,"shd")).forEach(e=>e.remove());log.push(["Colors","removed, black and white only"])}

 /* tables */
 if(o.tbl){
  const bd=["top","left","bottom","right","insideH","insideV"];let n=0;
  qa(doc,"tbl").forEach(tb=>{
   const tp=qa(tb,"tblPr")[0];if(!tp)return;
   const ex=qa(tp,"tblBorders")[0],sty=qa(tp,"tblStyle")[0];
   const has=(ex&&Array.from(ex.children).some(c=>!/^(nil|none)$/.test(attr(c,"val"))))||(sty&&/grid/i.test(attr(sty,"val")))||qa(tb,"tcBorders").some(b=>Array.from(b.children).some(c=>!/^(nil|none)$/.test(attr(c,"val"))));
   if(!has)return;
   if(ex)ex.remove();
   const nb=mk(doc,"tblBorders");bd.forEach(e=>nb.appendChild(mk(doc,e,{val:"single",sz:"4",space:"0",color:"000000"})));
   qa(tp,"tblW").forEach(e=>e.remove());qa(tp,"tblLayout").forEach(e=>e.remove());
   const tww=mk(doc,"tblW",{w:"5000",type:"pct"});
   const anchor=["jc","tblCellSpacing","tblInd"].map(x=>qa(tp,x)[0]).find(Boolean);
   anchor?tp.insertBefore(tww,anchor):tp.appendChild(tww);
   const after=["shd","tblLayout","tblCellMar","tblLook"].map(t=>qa(tp,t)[0]).find(Boolean);
   after?tp.insertBefore(nb,after):tp.appendChild(nb);
   qa(tb,"tcBorders").forEach(e=>e.remove());n++});
  if(n)log.push(["Tables",`${n} with black lines`]);
 }

 /* capitals, numbering, part bars */
 const paras=qa(doc,"p");
 useKW=paras.some(p=>!inTable(p)&&KW.test(text(p))&&isHeading(p)&&text(p).trim().length<=60);
 let caps=0,nums=0,n=0,bars=0;
 const barSz=String(Math.round((o.size+2)*2));
 paras.forEach(p=>{
  const ts=qa(p,"t");if(!ts.some(t=>t.textContent.trim()))return;
  const band=o.bands&&isBand(p);
  const h=isHeading(p);
  if(band||o.caps==="all"||(o.caps==="headings"&&h)){ts.forEach(t=>{const r=t.parentNode,va=r&&qa(r,"vertAlign")[0];if(!(va&&attr(va,"val")==="superscript"))t.textContent=t.textContent.toUpperCase()});caps++}
  const want=o.num==="headings"?h:o.num==="paras"?!inTable(p):false;
  if(want&&!band&&!qa(p,"numPr").length&&!/^\s*(\d+|[A-Za-z])[.)]\s/.test(text(p))){
   n++;const t=ts.find(x=>x.textContent.length)||ts[0];
   t.textContent=n+". "+t.textContent;t.setAttribute("xml:space","preserve");nums++}
  if(band){
   const old=qa(p,"pPr")[0],ps=old&&qa(old,"pStyle")[0],np=qa(old||p,"numPr")[0];
   if(old)old.remove();
   const pp=mk(doc,"pPr");
   if(ps)pp.appendChild(ps.cloneNode(true));
   pp.appendChild(mk(doc,"keepNext"));
   if(np)pp.appendChild(np.cloneNode(true));
   pp.appendChild(mk(doc,"shd",{val:"clear",color:"auto",fill:"000000"}));
   pp.appendChild(mk(doc,"spacing",{before:"160",after:"80",line:"240",lineRule:"auto"}));
   pp.appendChild(mk(doc,"ind",{left:"0",firstLine:"0"}));
   pp.appendChild(mk(doc,"jc",{val:"left"}));
   p.insertBefore(pp,p.firstChild);
   qa(p,"r").forEach(r=>{
    const va=qa(r,"vertAlign")[0],vv=va&&attr(va,"val");
    qa(r,"rPr").forEach(e=>e.remove());
    const rp=mk(doc,"rPr");rp.appendChild(mk(doc,"b"));rp.appendChild(mk(doc,"bCs"));rp.appendChild(mk(doc,"color",{val:"FFFFFF"}));rp.appendChild(mk(doc,"sz",{val:barSz}));rp.appendChild(mk(doc,"szCs",{val:barSz}));
    if(vv)rp.appendChild(mk(doc,"vertAlign",{val:vv}));
    r.insertBefore(rp,r.firstChild)});
   bars++}
 });
 if(bars)log.push(["Part bars",`${bars} black heading bar${bars>1?"s":""}`]);
 if(o.caps!=="none")log.push(["Capitals",`${caps} paragraphs`]);
 if(o.num!=="none")log.push(["Numbering",`${nums} paragraphs numbered`]);

 /* sections, margins, border, footer */
 const body=qa(doc,"body")[0];let secs=qa(doc,"sectPr");
 if(!secs.some(s=>s.parentNode===body)){body.appendChild(mk(doc,"sectPr"));secs=qa(doc,"sectPr")}
 const tw0=m=>Math.round(m*56.7),tm=tw0(parseFloat(o.mt)||15),lm=tw0(parseFloat(o.ml)||18);
 const footerOn=!!o.ft||o.pn!=="none";
 let width=11906;
 secs.forEach(sp=>{
  let sz=qa(sp,"pgSz")[0];
  if(!sz){sz=mk(doc,"pgSz",{w:11906,h:16838});sp.insertBefore(sz,sp.firstChild)}
  width=+attr(sz,"w")||11906;
  qa(sp,"pgMar").concat(qa(sp,"pgBorders")).forEach(e=>e.remove());
  const mar=mk(doc,"pgMar",{top:tm,right:lm,bottom:tm,left:lm,header:Math.min(708,Math.round(tm/2)),footer:Math.min(708,Math.round(tm/2)),gutter:0});
  sz.after(mar);
  if(o.border){
   const b=mk(doc,"pgBorders",{offsetFrom:"page"});
   ["top","left","bottom","right"].forEach(e=>b.appendChild(mk(doc,e,{val:"single",sz:6,space:24,color:"000000"})));
   mar.after(b);
  }
  if(footerOn){
   qa(sp,"footerReference").forEach(e=>e.remove());qa(sp,"titlePg").forEach(e=>e.remove());
   const fr=mk(doc,"footerReference",{type:"default"});fr.setAttributeNS(R,"r:id","rIdFmtFooter");
   sp.insertBefore(fr,sp.firstChild);
  }
 });
 log.push(["Page",`${o.mt} mm top and bottom, ${o.ml} mm sides${o.border?", page border":""}`]);
 const tw=width-2*lm;
 if(footerOn){
  zip.file("word/footerFmt.xml",footerXml(o,tw));
  const rf="word/_rels/document.xml.rels",rels=await zip.file(rf).async("string");
  zip.file(rf,rels.replace("</Relationships>",`<Relationship Id="rIdFmtFooter" Type="${R}/footer" Target="footerFmt.xml"/></Relationships>`));
  const cf="[Content_Types].xml",ct=await zip.file(cf).async("string");
  zip.file(cf,ct.replace("</Types>",`<Override PartName="/word/footerFmt.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`));
  const pl={none:"",n:"1",x:"Page 1",xofy:"Page 1 of N"}[o.pn];
  log.push(["Footer",[o.ft,pl&&pl+" ("+o.pos+")"].filter(Boolean).join(", ")]);
 }

 /* title block and student box (inserted last so they are not restyled) */
 const use=o.lg&&logo,ins=[];
 const lead=paras.filter(p=>!inTable(p)).slice(0,3);
 let banner=lead.some(p=>qa(p,"drawing").length||qa(p,"pict").length);
 if(!banner){for(const f of Object.keys(zip.files)){if(/^word\/header\d*\.xml$/.test(f)){const x=await zip.file(f).async("string");if(/<w:drawing|<w:pict/.test(x)){banner=true;break}}}}
 const first8=paras.filter(p=>!inTable(p)&&text(p).trim()).slice(0,8).map(text).join("\n");
 const hasInfo=/(^|\n)\s*(magaca|name|student|date|class|grade|fasalka|taariikh)\b/i.test(first8);
 if(banner&&o.tb){o.tb=false;log.push(["Title block","skipped, your document already has a school banner"])}
 if(hasInfo&&o.ib){o.ib=false;log.push(["Student box","skipped, your document already has Name and Date lines"])}
 if(o.tb&&(o.t1||o.t2||o.t3||use)){
  if(use){
   zip.file("word/media/fmtlogo."+logo.ext,logo.bytes);
   const rf="word/_rels/document.xml.rels",rels=await zip.file(rf).async("string");
   zip.file(rf,rels.replace("</Relationships>",`<Relationship Id="rIdFmtLogo" Type="${R}/image" Target="media/fmtlogo.${logo.ext}"/></Relationships>`));
   const cf="[Content_Types].xml",ct=await zip.file(cf).async("string");
   if(!ct.includes(`Extension="${logo.ext}"`))zip.file(cf,ct.replace("</Types>",`<Default Extension="${logo.ext}" ContentType="image/${logo.ext}"/></Types>`));
  }
  ins.push(...frag(doc,titleXml(o,tw,use)));
  log.push(["Title block",[use?"logo":"",o.t1].filter(Boolean).join(", ")||"added"]);
 }
 if(o.ib){ins.push(...frag(doc,infoXml(o,tw)));log.push(["Student box","Class, marks, name, roll no, date, teacher"])}
 const first=body.firstChild;ins.forEach(x=>body.insertBefore(x,first));

 zip.file("word/document.xml",S.serializeToString(doc));
 return{data:await zip.generateAsync({type:"uint8array",compression:"DEFLATE"}),log};
}
</script>
